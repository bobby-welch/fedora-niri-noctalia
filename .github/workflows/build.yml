name: bluebuild

on:
  # Rebuild daily to pick up updates from the Fedora base image.
  schedule:
    - cron: "00 06 * * *"

  # Publish changes to the image definition.
  push:
    branches:
      - main
    paths:
      - "recipes/**"
      - "files/**"
      - "cosign.pub"
      - ".github/workflows/build.yml"

  # Allow manual builds.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  bluebuild:
    name: Build Custom Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        recipe:
          - recipe.yml

    steps:
      - name: Build Custom Image
        uses: blue-build/github-action@v1.13
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          maximize_build_space: true
