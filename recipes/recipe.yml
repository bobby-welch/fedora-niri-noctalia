---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: fedora-noctalia
description: A custom Fedora Atomic desktop using BlueBuild, Niri, and Noctalia.

# Universal Blue's minimal base, pinned to Fedora 44.
base-image: ghcr.io/ublue-os/base-main
image-version: 44

modules:
  # Install system-level configuration from files/system/.
  - type: files
    files:
      - source: system
        destination: /

  # Install desktop packages and configure third-party repositories.
  - type: dnf
    repos:
      copr:
        - scottames/ghostty
    install:
      packages:
        # Desktop and login
        - greetd
        - greetd-selinux
        - niri
        - noctalia
        - tuigreet

        # Authentication and secrets
        - gnome-keyring
        - gnome-keyring-pam
        - polkit

        # Portals
        - xdg-desktop-portal
        - xdg-desktop-portal-gnome
        - xdg-desktop-portal-gtk

        # Terminal
        - ghostty

        # Audio and media
        - pipewire
        - pipewire-alsa
        - pipewire-pulseaudio
        - playerctl
        - wireplumber

        # Hardware and Wayland utilities
        - brightnessctl
        - wl-clipboard

        # Power management
        - tuned
        - tuned-ppd

        # Storage and file integration
        - gvfs
        - gvfs-fuse
        - gvfs-smb

  # Validate Niri configuration with the installed compositor.
  - type: script
    snippets:
      - niri validate --config /etc/niri/config.kdl

  # Enable login and power-management services.
  - type: systemd
    system:
      enabled:
        - greetd.service
        - tuned.service
        - tuned-ppd.service

  # Configure image signature verification for Atomic deployments.
  - type: signing
