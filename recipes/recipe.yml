---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: fedora-niri-noctalia
description: A personal Fedora Atomic desktop image built around Niri and Noctalia.

base-image: ghcr.io/ublue-os/base-main
image-version: 44

modules:
  # Copy image-level configuration from files/system/ into the image root.
  - type: files
    files:
      - source: system
        destination: /

  # Add custom ujust commands from files/justfiles/.
  - type: justfiles
    validate: true

  - type: dnf
    install:
      packages:
        - 7zip
        - adw-gtk3-theme
        - age
        - alacritty
        - avahi
        - bat
        - bluez
        - brightnessctl
        - chezmoi
        - cups
        - distrobox
        - eza
        - fd-find
        - fish
        - fwupd
        - fzf
        - git
        - gnome-calculator
        - gnome-keyring
        - gnome-keyring-pam
        - google-noto-color-emoji-fonts
        - google-noto-sans-vf-fonts
        - google-noto-serif-vf-fonts
        - greetd
        - greetd-selinux
        - gvfs-archive
        - gvfs-fuse
        - gvfs-mtp
        - gvfs-smb
        - htop
        - nautilus
        - NetworkManager
        - NetworkManager-wifi
        - neovim
        - niri
        - noctalia
        - openssh-clients
        - papers
        - pipewire
        - pipewire-pulseaudio
        - playerctl
        - podman
        - polkit
        - rclone
        - ripgrep
        - rsms-inter-fonts
        - swayimg
        - tmux
        - tuned-ppd
        - tuigreet
        - unzip
        - upower
        - wireplumber
        - wl-clipboard
        - xdg-desktop-portal-gnome
        - xdg-desktop-portal-gtk
        - xdg-utils
        - zathura
        - zathura-pdf-poppler
        - zip

    remove:
      packages:
        # base-main normally omits Firefox; remove it defensively in case that changes upstream.
        - firefox
        - firefox-langpacks

  # Install Brave from its official RPM repository, then remove the build-time repository.
  - type: dnf
    repos:
      cleanup: true
      files:
        - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
    install:
      packages:
        - brave-origin

  # Install Starship from its Fedora COPR, then remove the build-time repository.
  - type: dnf
    repos:
      cleanup: true
      copr:
        - atim/starship
    install:
      packages:
        - starship

  # Install Ghostty from its recommended Fedora COPR, then remove the build-time repository.
  - type: dnf
    repos:
      cleanup: true
      copr:
        - scottames/ghostty
    install:
      packages:
        - ghostty

  - type: fonts
    fonts:
      nerd-fonts:
        - IosevkaTerm

  - type: systemd
    system:
      enabled:
        - avahi-daemon.service
        - cups.socket
        - greetd.service

  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        install:
          - com.sigil_ebook.Sigil
          - io.github.lullabyX.sone
          - md.obsidian.Obsidian
          - org.gtk.Gtk3theme.adw-gtk3
          - org.gtk.Gtk3theme.adw-gtk3-dark
          - org.libreoffice.LibreOffice

  - type: signing
