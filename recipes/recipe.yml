---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: fedora-niri-noctalia
description: A custom Fedora Atomic desktop using BlueBuild, Niri, and Noctalia.

# Universal Blue's minimal base, pinned to Fedora 44.
base-image: ghcr.io/ublue-os/base-main
image-version: 44

modules:
  # Install system-level configuration from files/system/.
  - type: files
    files:
      - source: system
        destination: /

  # Install desktop packages and configure third-party repositories.
  - type: dnf
    repos:
      copr:
        - atim/starship
        - scottames/ghostty
        - magnusrc/lazygit
      files:
        - 1password.repo
        - brave-browser.repo
      keys:
        - https://downloads.1password.com/linux/keys/1password.asc
        - https://brave-browser-rpm-release.s3.brave.com/brave-core.asc
    install:
      packages:
        # Desktop and login
        - greetd
        - greetd-selinux
        - niri
        - noctalia
        - tuigreet

        # Authentication and secrets
        - gnome-keyring
        - gnome-keyring-pam
        - polkit

        # Portals
        - xdg-desktop-portal
        - xdg-desktop-portal-gnome
        - xdg-desktop-portal-gtk
        - xdg-user-dirs

        # Terminal
        - ghostty

        # Audio and media
        - pipewire
        - pipewire-alsa
        - pipewire-pulseaudio
        - playerctl
        - wireplumber

        # Hardware and Wayland utilities
        - brightnessctl
        - wl-clipboard

        # Power management
        - tuned
        - tuned-ppd

        # Storage and file integration
        - gvfs
        - gvfs-fuse
        - gvfs-smb

        # Desktop applications
        - adw-gtk3-theme
        - gnome-calculator
        - nautilus
        - swayimg
        - zathura
        - zathura-pdf-poppler

        # Git and development
        - chezmoi
        - gh
        - git
        - git-delta
        - git-lfs
        - lazygit
        - neovim

        # Command-line utilities
        - bat
        - btop
        - eza
        - fd-find
        - fzf
        - ripgrep
        - starship
        - wget
        - yq
        - zoxide

        # Third-party desktop applications
        - 1password
        - brave-origin

        # Fonts
        - rsms-inter-vf-fonts

  # Install the terminal Nerd Font.
  - type: fonts
    fonts:
      nerd-fonts:
        - IosevkaTerm

  # Validate Niri and temporarily patch upstream session warning.
  - type: script
    snippets:
      - niri validate --config /etc/niri/config.kdl
      - |
        python3 - <<'PY'
        from pathlib import Path

        path = Path("/usr/bin/niri-session")
        original = "    systemctl --user import-environment\n"
        replacement = (
            "    systemctl --user import-environment "
            "$(printenv | cut -d'=' -f1 | tr '\\n' ' ')\n"
        )

        script = path.read_text()
        if script.count(original) != 1:
            raise SystemExit("Niri session changed; review compatibility patch")

        path.write_text(script.replace(original, replacement))
        print("Applied Niri environment-import compatibility patch")
        PY
      - bash -n /usr/bin/niri-session

  # Enable login and power-management services.
  - type: systemd
    system:
      enabled:
        - greetd.service
        - tuned.service
        - tuned-ppd.service

  # Configure image signature verification for Atomic deployments.
  - type: signing
